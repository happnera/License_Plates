<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Hall License Plate Challenge</title>
<style>
body{font-family:-apple-system;padding:16px;background:#f6f8fb}
.card{background:#fff;padding:16px;border-radius:16px}
.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.color{height:40px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.selected{border-color:black}
button{padding:12px;border-radius:10px;border:none;font-weight:bold}
.primary{background:#2457ff;color:#fff}
</style>
</head>
<body>

<h2>🚗 A-Hall License Plate Challenge</h2>

<div class="card">
<label>Room code</label>
<input id="room" placeholder="family-road-trip"><br><br>

<label>Your name</label>
<input id="name" placeholder="Ashley"><br><br>

<label>Pick your color</label>
<div id="colors" class="color-grid"></div><br>

<button class="primary">Join Game</button>
</div>

<script>
const palette=["#ffd7d7","#ffe7bf","#fff5b3","#dcf7c8","#cff7ec","#d8ecff","#e3ddff","#ffd7f3","#f4d8ff","#d9d9d9"];
let selected=palette[0];

const wrap=document.getElementById("colors");

palette.forEach(c=>{
  const div=document.createElement("div");
  div.className="color";
  div.style.background=c;
  if(c===selected) div.classList.add("selected");
  div.onclick=()=>{
    selected=c;
    document.querySelectorAll(".color").forEach(el=>el.classList.remove("selected"));
    div.classList.add("selected");
  };
  wrap.appendChild(div);
});
</script>

</body>
</html>
