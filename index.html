<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>A-Hall License Plate Challenge</title>
  <style>
    :root{
      --bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#63708a;--line:#dbe2ee;
      --blue:#2457ff;--done:#dfe9ff;--shadow:0 8px 24px rgba(20,34,66,.08)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{min-height:100vh}
    .wrap{max-width:900px;margin:0 auto;padding:18px 14px 70px}
    .hero{text-align:center;padding:8px 10px 18px}
    h1{margin:0;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.08}
    .sub{margin-top:8px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px}
    .progress-top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
    .progress-title,.progress-count{font-weight:800}
    .progress-bar{height:18px;border-radius:999px;background:#e7edf7;overflow:hidden;border:1px solid var(--line);margin-top:10px}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#6ea8ff,#2457ff);transition:width .25s ease}
    .progress-label{margin-top:7px;color:var(--muted);font-size:.9rem;font-weight:700}
    .section-title{margin:18px 2px 9px;font-size:1.03rem;font-weight:800}
    .countline{color:var(--muted);font-size:.9rem;margin:0 2px 10px}
    .states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .state{
      border:1px solid var(--line);
      border-radius:15px;
      background:#fff;
      min-height:58px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.96rem;
      font-weight:800;
      box-shadow:var(--shadow);
      cursor:pointer;
      text-align:center;
      min-width:0;
      position:relative;
    }
    .state:active{transform:scale(.985)}
    .state-name{min-width:0;overflow-wrap:anywhere}
    .state.done{
      background:var(--blue);
      color:#fff;
      border-color:var(--blue);
      padding-right:34px;
    }
    .state.done::after{
      content:"✓";
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      font-size:1.05rem;
      font-weight:900;
    }
    .actions{display:flex;justify-content:center;margin-top:22px}
    .reset{border:0;border-radius:12px;padding:12px 18px;font-size:.94rem;font-weight:800;background:#eef1f6;color:#45536a;cursor:pointer}
    .celebration{display:none;position:relative;overflow:hidden;margin:18px 0 0;padding:22px 16px;text-align:center;border-radius:20px;background:linear-gradient(135deg,#fff7c7,#dff6ff,#e8e3ff);border:1px solid #cdd9f0}
    .celebration.show{display:block;animation:pop .45s ease-out}
    .celebration .big{font-size:2.1rem;font-weight:900;line-height:1.1}
    .celebration .small{margin-top:7px;color:#4b5870;font-weight:700}
    .trophy{font-size:3rem;margin-bottom:6px;display:block;animation:bounce .7s ease}
    .confetti-layer{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:9999}
    .confetti{position:absolute;width:10px;height:16px;top:-24px;border-radius:2px;animation:fall linear forwards}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(900deg);opacity:.95}}
    @keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px)}}
    @media (max-width:620px){.states{grid-template-columns:repeat(2,minmax(0,1fr))}.state{font-size:.91rem;padding:9px}}
    @media (max-width:340px){.states{grid-template-columns:1fr}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🚗 A-Hall License Plate Challenge</h1>
    <div class="sub">Find all 50 states</div>
  </div>

  <div class="card">
    <div class="progress-top">
      <div class="progress-title">Progress</div>
      <div class="progress-count" id="progressCount">0 / 50</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0% complete</div>
  </div>

  <div id="celebration" class="celebration" aria-live="polite">
    <span class="trophy">🏆</span>
    <div class="big">ALL 50 STATES!</div>
    <div class="small">You completed the License Plate Challenge! 🎉🚗🇺🇸</div>
  </div>

  <div class="section-title">States to find</div>
  <div class="countline" id="remainingLine">50 remaining</div>
  <div class="states" id="activeStates"></div>

  <div class="section-title" id="completedTitle" style="display:none;">Completed</div>
  <div class="countline" id="completedLine" style="display:none;"></div>
  <div class="states" id="completedStates"></div>

  <div class="actions">
    <button class="reset" id="resetBtn" type="button">Reset All</button>
  </div>
</div>

<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

<script>
const STATES=[
  "Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia",
  "Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland",
  "Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey",
  "New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina",
  "South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"
];

const STORAGE_KEY="a-hall-license-plate-single-player-v1";
const CELEBRATED_KEY="a-hall-license-plate-celebrated-v1";
let completed=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"));

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...completed]));}
function toggleState(state){
  if(completed.has(state)){completed.delete(state);localStorage.removeItem(CELEBRATED_KEY);}
  else{completed.add(state);}
  save();render();
}
function makeStateButton(state,done){
  const btn=document.createElement("button");
  btn.type="button";
  btn.className="state"+(done?" done":"");
  btn.setAttribute("aria-pressed",done?"true":"false");
  btn.innerHTML=`<span class="state-name">${state}</span>`;
  btn.addEventListener("click",()=>toggleState(state));
  return btn;
}
function launchConfetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const layer=document.getElementById("confettiLayer");
  layer.innerHTML="";
  const colors=["#2457ff","#ffcf33","#ff6b6b","#45c486","#9b6bff","#ff8f3d"];
  for(let i=0;i<120;i++){
    const piece=document.createElement("span");
    piece.className="confetti";
    piece.style.left=(Math.random()*100)+"vw";
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.setProperty("--drift",((Math.random()*220)-110)+"px");
    piece.style.animationDuration=(2.5+Math.random()*2.2)+"s";
    piece.style.animationDelay=(Math.random()*.7)+"s";
    piece.style.opacity=(.65+Math.random()*.35).toFixed(2);
    piece.style.transform=`rotate(${Math.random()*360}deg)`;
    layer.appendChild(piece);
  }
  setTimeout(()=>{layer.innerHTML="";},5500);
}
function render(){
  const activeWrap=document.getElementById("activeStates");
  const completedWrap=document.getElementById("completedStates");
  activeWrap.innerHTML="";completedWrap.innerHTML="";
  const active=STATES.filter(s=>!completed.has(s));
  const done=STATES.filter(s=>completed.has(s));
  active.forEach(s=>activeWrap.appendChild(makeStateButton(s,false)));
  done.forEach(s=>completedWrap.appendChild(makeStateButton(s,true)));
  document.getElementById("remainingLine").textContent=`${active.length} remaining`;
  document.getElementById("completedLine").textContent=`${done.length} completed`;
  document.getElementById("completedTitle").style.display=done.length?"":"none";
  document.getElementById("completedLine").style.display=done.length?"":"none";
  const pct=Math.round((done.length/50)*100);
  document.getElementById("progressCount").textContent=`${done.length} / 50`;
  document.getElementById("progressFill").style.width=`${pct}%`;
  document.getElementById("progressLabel").textContent=`${pct}% complete`;
  const celebration=document.getElementById("celebration");
  if(done.length===50){
    celebration.classList.add("show");
    if(localStorage.getItem(CELEBRATED_KEY)!=="yes"){
      launchConfetti();
      localStorage.setItem(CELEBRATED_KEY,"yes");
    }
  }else{celebration.classList.remove("show");}
}
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Reset all 50 states and start over?")){
    completed.clear();
    localStorage.removeItem(CELEBRATED_KEY);
    save();render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
});
render();
</script>
</body>
</html>
