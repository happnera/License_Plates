<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>A-Hall License Plate Challenge</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#63708a;--line:#dbe2ee;--blue:#2457ff;--done:#dfe9ff;--shadow:0 8px 24px rgba(20,34,66,.08)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:18px 14px 70px}
    .hero{text-align:center;padding:8px 10px 18px}
    h1{margin:0;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.08}
    .sub{margin-top:8px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px}
    .progress-top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
    .progress-title,.progress-count{font-weight:800}
    .progress-bar{height:18px;border-radius:999px;background:#e7edf7;overflow:hidden;border:1px solid var(--line);margin-top:10px}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#6ea8ff,#2457ff);transition:width .2s ease}
    .progress-label{margin-top:7px;color:var(--muted);font-size:.9rem;font-weight:700}
    .section-title{margin:18px 2px 9px;font-size:1.03rem;font-weight:800}
    .countline{color:var(--muted);font-size:.9rem;margin:0 2px 10px}
    .states{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .state{border:1px solid var(--line);border-radius:15px;background:#fff;min-height:58px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;box-shadow:var(--shadow);cursor:pointer;text-align:left}
    .state:active{transform:scale(.985)}
    .check{width:24px;height:24px;border-radius:7px;border:2px solid #9eabc0;display:grid;place-items:center;flex:0 0 24px;font-size:.95rem}
    .state.done{background:var(--done);color:#38507a}
    .state.done .check{background:var(--blue);border-color:var(--blue);color:#fff}
    .actions{display:flex;justify-content:center;margin-top:20px}
    .reset{border:0;border-radius:12px;padding:11px 15px;font-size:.92rem;font-weight:700;background:#f3f5f8;color:#45536a;cursor:pointer}
    @media (max-width:520px){.states{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🚗 A-Hall License Plate Challenge</h1>
    <div class="sub">Find all 50 states</div>
  </div>

  <div class="card">
    <div class="progress-top">
      <div class="progress-title">Progress</div>
      <div class="progress-count" id="progressCount">0 / 50</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0% complete</div>
  </div>

  <div class="section-title">States to find</div>
  <div class="countline" id="remainingLine">50 remaining</div>
  <div class="states" id="activeStates"></div>

  <div class="section-title" id="completedTitle" style="display:none;">Completed</div>
  <div class="countline" id="completedLine" style="display:none;"></div>
  <div class="states" id="completedStates"></div>

  <div class="actions"><button class="reset" id="resetBtn">Reset all states</button></div>
</div>

<script>
const STATES=["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];
const STORAGE_KEY="a-hall-license-plate-single-player-v1";
let completed=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"));

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...completed]));}
function toggleState(state){completed.has(state)?completed.delete(state):completed.add(state);save();render();}
function makeStateButton(state,done){
  const btn=document.createElement("button");
  btn.type="button";
  btn.className="state"+(done?" done":"");
  btn.innerHTML=`<span class="check">${done?"✓":""}</span><span>${state}</span>`;
  btn.onclick=()=>toggleState(state);
  return btn;
}
function render(){
  const activeWrap=document.getElementById("activeStates");
  const completedWrap=document.getElementById("completedStates");
  activeWrap.innerHTML="";completedWrap.innerHTML="";
  const active=STATES.filter(s=>!completed.has(s));
  const done=STATES.filter(s=>completed.has(s));
  active.forEach(s=>activeWrap.appendChild(makeStateButton(s,false)));
  done.forEach(s=>completedWrap.appendChild(makeStateButton(s,true)));
  document.getElementById("remainingLine").textContent=`${active.length} remaining`;
  document.getElementById("completedLine").textContent=`${done.length} completed`;
  document.getElementById("completedTitle").style.display=done.length?"":"none";
  document.getElementById("completedLine").style.display=done.length?"":"none";
  const pct=Math.round((done.length/50)*100);
  document.getElementById("progressCount").textContent=`${done.length} / 50`;
  document.getElementById("progressFill").style.width=`${pct}%`;
  document.getElementById("progressLabel").textContent=`${pct}% complete`;
}
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset all 50 states?")){completed.clear();save();render();}};
render();
</script>
</body>
</html>
